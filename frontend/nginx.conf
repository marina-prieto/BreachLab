server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    location / {
        try_files $uri $uri/ $uri.html /index.html;

        # 6) Configuracion de seguridad (A05): en modo VULNERABLE no se envia
        # ninguna cabecera de hardening (asi el payload XSS de note.astro se
        # ejecuta sin trabas). En modo SEGURO (?safe=1) se anaden CSP y el
        # resto de cabeceras -> la CSP bloquea el onerror inline aunque
        # innerHTML se siguiera usando, y ademas note.astro ya usa textContent
        # en este modo (defensa en profundidad).
        if ($arg_safe = "1") {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
        }
    }

    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        if ($arg_safe = "1") {
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
